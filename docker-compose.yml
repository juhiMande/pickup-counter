services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pickup
      POSTGRES_PASSWORD: pickup
      POSTGRES_DB: pickup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickup -d pickup"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://pickup:pickup@db:5432/pickup
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
      HOLD_SECONDS: ${HOLD_SECONDS:-120}
      PORT: 3000
      API_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Not started by `docker compose up`. Run with:
  #   docker compose --profile test run --rm tests
  tests:
    build: ./backend
    profiles: ["test"]
    command: ["npm", "test"]
    environment:
      DATABASE_URL: postgres://pickup:pickup@db:5432/pickup_test
      WEBHOOK_SECRET: test-secret
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
